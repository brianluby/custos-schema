[workspace]
resolver = "2"
members = ["crates/ocsf-core", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/brianluby/custos-schema"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "0.8"
